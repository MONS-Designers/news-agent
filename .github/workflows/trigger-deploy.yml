# Minimal trigger only -- the real build/push/deploy pipeline now lives in
# news-agent-infra's deploy.yml (spec-gitops-deploy-trigger), not here. This
# Action's only job is to tell that pipeline which branch/commit just landed;
# it does no docker build, no Azure login, no ACR push.
name: trigger-deploy

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # branches: [dev, main] above guarantees github.ref_name is always one
      # of exactly those two -- dev maps to stage, main maps to prod.
      - name: Map branch to environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "environment=stage" >> "$GITHUB_OUTPUT"
          else
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch deploy to news-agent-infra
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MONS-Designers/news-agent-infra/dispatches \
            -d '{"event_type":"deploy","client_payload":{"environment":"${{ steps.env.outputs.environment }}","sha":"${{ github.sha }}"}}'
