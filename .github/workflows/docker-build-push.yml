# Place at .github/workflows/docker-build-push.yml in news-agent.
#
# Builds both images on every push to dev and pushes them to the shared ACR
# (also used by the prod environment later), tagged with the triggering
# commit SHA. OIDC login only -- no stored Azure secret. Build-and-push only:
# nothing here writes a tag file or deploys anywhere (that mechanism doesn't
# exist yet).
name: docker-build-push

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC federated login
  contents: read

env:
  ACR_LOGIN_SERVER: newsagentacr.azurecr.io   # terraform output: acr_login_server
  VITE_API_BASE: https://newsagent-api-stage.azurewebsites.net

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name newsagentacr

      - name: Build and push backend
        run: |
          docker build \
            -f Dockerfile.backend \
            --build-arg VITE_API_BASE="$VITE_API_BASE" \
            -t "$ACR_LOGIN_SERVER/newsagent-api:${{ github.sha }}" \
            .
          docker push "$ACR_LOGIN_SERVER/newsagent-api:${{ github.sha }}"

      - name: Build and push frontend
        run: |
          docker build \
            -f Dockerfile.frontend \
            --build-arg VITE_API_BASE="$VITE_API_BASE" \
            -t "$ACR_LOGIN_SERVER/newsagent-frontend:${{ github.sha }}" \
            .
          docker push "$ACR_LOGIN_SERVER/newsagent-frontend:${{ github.sha }}"
