# SPA fallback for the containerized frontend -- same behavior as
# news-agent-infra's deploy/nginx.conf app.* server block, adapted to run
# inside nginxinc/nginx-unprivileged (listens on 8080, non-root).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
