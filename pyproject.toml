[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsagent"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
packages = ["newsagent"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "feedparser.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

# Pinned explicitly, not inherited from ruff's default: 0.16.0 widened that
# default (adding B, I, UP, RUF) and turned an unrelated linter release into a
# red CI on untouched files. This is the set the project has always enforced.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]