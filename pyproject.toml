[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsagent"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
packages = ["newsagent"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true
